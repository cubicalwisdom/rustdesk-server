name: RCGK Verify

on:
  push:
    branches:
      - rcgk-server
      - "feature/**"
      - "upgrade/**"
  pull_request:
    branches:
      - rcgk-server
      - master
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable RCGK image tag
        required: true
        default: 1.1.16-rcgk.1

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all-features --locked

  build-arm64:
    name: Build ARM64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build ARM64 binaries
        run: cross build --release --all-features --locked --target aarch64-unknown-linux-musl

      - name: Upload ARM64 binaries
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-server-linux-arm64
          path: |
            target/aarch64-unknown-linux-musl/release/hbbs
            target/aarch64-unknown-linux-musl/release/hbbr
            target/aarch64-unknown-linux-musl/release/rustdesk-utils
          if-no-files-found: error

  publish-arm64-image:
    name: Publish ARM64 image
    if: github.event_name == 'workflow_dispatch'
    needs:
      - test
      - build-arm64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download ARM64 binaries
        uses: actions/download-artifact@v4
        with:
          name: rustdesk-server-linux-arm64
          path: docker-classic

      - name: Make binaries executable
        run: chmod a+x docker-classic/hbbs docker-classic/hbbr docker-classic/rustdesk-utils

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: docker-classic
          platforms: linux/arm64
          push: true
          provenance: true
          tags: ghcr.io/${{ github.repository_owner }}/rustdesk-server:${{ inputs.image_tag }}-arm64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.image_tag }}
